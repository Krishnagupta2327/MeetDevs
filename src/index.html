<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Document</title>
</head>
<body>
      <script type="text/javascript">

let n=parseInt(prompt("Enter n:"));
if(n<2){
      alert(n+" is not prime");
}
else{
      let flag=true;
      let a=Math.sqrt(n);
      for(let i=2;i<=a;i++){
            if(n%i==0){
                  flag=false;
                  break;
            }
      }
      if(flag==true){
            alert(n+" is prime");
      }
      else{
            alert(n+" is not prime");
      }
}
</script>
</body>
</html>
